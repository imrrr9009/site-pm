# Netlify configuration (also a useful starting point for other hosts)
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirect non-www to www (change this if you prefer the bare domain)
[[redirects]]
  from = "https://madeformore.nl/*"
  to = "https://www.madeformore.nl/:splat"
  status = 301
  force = true
